<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnóstico Técnico Serverless</title>
    <link rel="manifest" href="manifest.json" />
    <link
      rel="apple-touch-icon"
      href="https://img.icons8.com/color/512/maintenance.png"
    />
    <meta name="theme-color" content="#0284c7" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans"
  >
    <!-- TELA DE LOGIN -->
    <div
      id="login-screen"
      class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50"
    >
      <div
        class="bg-slate-900 p-6 sm:p-8 rounded-2xl border border-slate-800 w-full max-w-md shadow-2xl space-y-6"
      >
        <div class="text-center">
          <h2 class="text-2xl font-bold text-slate-100">Acesso ao Sistema</h2>
          <p class="text-xs text-slate-400 mt-1">
            Insira suas credenciais técnicas
          </p>
        </div>

        <form onsubmit="executarLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1"
              >Usuário / RE</label
            >
            <input
              type="text"
              id="login-user"
              required
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500"
            />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Senha</label>
            <input
              type="password"
              id="login-pass"
              required
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500"
            />
          </div>
          <button
            type="submit"
            id="btn-login"
            class="w-full bg-sky-600 hover:bg-sky-500 text-white py-2.5 rounded-lg text-sm font-semibold transition"
          >
            Entrar
          </button>
        </form>
      </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div
      id="app-screen"
      class="hidden flex-1 max-w-4xl mx-auto p-4 sm:p-6 w-full"
    >
      <header
        class="flex justify-between items-center pb-4 mb-6 border-b border-slate-800"
      >
        <div>
          <h1 class="text-xl font-bold text-sky-400">⚡ Diagnóstico Técnico</h1>
          <p class="text-xs text-slate-400">
            Técnico Ativo:
            <span id="label-tecnico" class="text-slate-200 font-semibold"
              >--</span
            >
          </p>
        </div>
        <button
          onclick="logout()"
          class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition"
        >
          Sair
        </button>
      </header>

      <!-- Navegação -->
      <div
        class="flex gap-2 mb-6 bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs sm:text-sm"
      >
        <button
          onclick="switchTab('consultar')"
          id="tab-btn-consultar"
          class="flex-1 py-2 rounded-lg font-semibold bg-sky-600 text-white"
        >
          🔍 Consultar
        </button>
        <button
          onclick="switchTab('cadastrar')"
          id="tab-btn-cadastrar"
          class="flex-1 py-2 rounded-lg font-semibold text-slate-400 hover:text-white"
        >
          ➕ Ocorrência
        </button>
        <button
          onclick="switchTab('admin')"
          id="tab-btn-admin"
          class="hidden flex-1 py-2 rounded-lg font-semibold text-slate-400 hover:text-white"
        >
          ⚙️ Usuários (Admin)
        </button>
      </div>

      <!-- CONSULTAR DEFEITOS -->
      <section id="tab-consultar" class="space-y-4">
        <div
          class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex gap-2"
        >
          <input
            type="text"
            id="search-input"
            placeholder="Buscar por sintoma, linha ou equipamento..."
            class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500"
          />
          <button
            onclick="buscarOcorrencias()"
            class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg text-sm font-semibold"
          >
            Buscar
          </button>
        </div>
        <div id="results-container" class="space-y-3"></div>
      </section>

      <!-- REGISTRAR OCORRÊNCIA -->
      <section
        id="tab-cadastrar"
        class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4"
      >
        <form onsubmit="salvarOcorrencia(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1"
                >Linha de Produção</label
              >
              <select
                id="select-linha"
                required
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500 text-slate-200"
              >
                <option value="">Carregando linhas...</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1"
                >Equipamento</label
              >
              <select
                id="select-equipamento"
                required
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500 text-slate-200"
              >
                <option value="">Carregando equipamentos...</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1"
              >Sintoma / Falha Observada</label
            >
            <input
              type="text"
              id="cad-falha"
              required
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500"
            />
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1"
              >Ação Técnica / Solução Aplicada</label
            >
            <textarea
              id="cad-solucao"
              rows="3"
              required
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500"
            ></textarea>
          </div>

          <button
            type="submit"
            id="btn-salvar-ocorrencia"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg text-sm font-semibold transition"
          >
            Registrar Ocorrência
          </button>
        </form>
      </section>

      <!-- GESTÃO DE USUÁRIOS (ADMIN) -->
      <section id="tab-admin" class="hidden space-y-6">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
          <h3 class="text-sm font-bold text-sky-400 mb-4">
            Cadastrar / Editar Usuário
          </h3>
          <form
            onsubmit="salvarUsuario(event)"
            class="grid grid-cols-1 sm:grid-cols-3 gap-4"
          >
            <input
              type="text"
              id="admin-user-name"
              placeholder="Nome / Identificador"
              required
              class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm"
            />
            <div class="flex gap-1">
              <input
                type="password"
                id="admin-user-pass"
                placeholder="Senha"
                class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm"
              />
              <button
                type="button"
                onclick="gerarSenhaRandomica()"
                class="bg-slate-700 hover:bg-slate-600 px-2 rounded-lg text-xs"
              >
                Gerar
              </button>
            </div>
            <select
              id="admin-user-role"
              class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm"
            >
              <option value="tecnico">Técnico</option>
              <option value="admin">Administrador</option>
            </select>
            <button
              type="submit"
              class="sm:col-span-3 bg-sky-600 hover:bg-sky-500 text-white py-2 rounded-lg text-sm font-semibold"
            >
              Salvar Usuário
            </button>
          </form>
        </div>

        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
          <h3 class="text-sm font-bold text-slate-300 mb-3">
            Usuários Cadastrados
          </h3>
          <div id="users-list-container" class="space-y-2"></div>
        </div>
      </section>
    </div>

    <footer
      class="py-4 border-t border-slate-800 text-center text-xs text-slate-500 mt-auto"
    >
      Desenvolvido por
      <a
        href="https://github.com/allanrein"
        target="_blank"
        class="text-sky-400 hover:underline font-medium"
        >Allan Rein</a
      >
    </footer>

    <script>
      const API_URL = "https://rshjl30231.execute-api.us-east-1.amazonaws.com";
      let usuarioLogado = null;

      async function executarLogin(e) {
        e.preventDefault();
        const usuario = document.getElementById("login-user").value;
        const senha = document.getElementById("login-pass").value;

        try {
          const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuario, senha }),
          });

          if (!res.ok) throw new Error("Credenciais inválidas");
          const data = await res.json();

          usuarioLogado = data;
          document.getElementById("label-tecnico").innerText =
            `${data.usuario} (${data.role})`;
          document.getElementById("login-screen").classList.add("hidden");
          document.getElementById("app-screen").classList.remove("hidden");

          if (data.role === "admin") {
            document.getElementById("tab-btn-admin").classList.remove("hidden");
          }

          carregarDropdowns();
          buscarOcorrencias();
        } catch (err) {
          alert(err.message);
        }
      }

      function logout() {
        usuarioLogado = null;
        document.getElementById("app-screen").classList.add("hidden");
        document.getElementById("login-screen").classList.remove("hidden");
      }

      function switchTab(tab) {
        ["consultar", "cadastrar", "admin"].forEach((t) => {
          const sec = document.getElementById(`tab-${t}`);
          const btn = document.getElementById(`tab-btn-${t}`);
          if (sec) sec.classList.toggle("hidden", t !== tab);
          if (btn)
            btn.className =
              t === tab
                ? "flex-1 py-2 rounded-lg font-semibold bg-sky-600 text-white"
                : "flex-1 py-2 rounded-lg font-semibold text-slate-400 hover:text-white";
        });

        if (tab === "admin") carregarUsuarios();
      }

      async function carregarDropdowns() {
        try {
          const [resLinhas, resEquip] = await Promise.all([
            fetch(`${API_URL}/linhas`),
            fetch(`${API_URL}/equipamentos`),
          ]);

          const linhas = await resLinhas.json();
          const equipamentos = await resEquip.json();

          document.getElementById("select-linha").innerHTML = linhas
            .map(
              (l) =>
                `<option value="${l.nome || l.id}">${l.nome || l.id}</option>`,
            )
            .join("");
          document.getElementById("select-equipamento").innerHTML = equipamentos
            .map(
              (e) =>
                `<option value="${e.nome || e.id}">${e.nome || e.id}</option>`,
            )
            .join("");
        } catch (err) {
          console.error("Erro ao carregar dropdowns:", err);
        }
      }

      async function buscarOcorrencias() {
        const termo = document.getElementById("search-input").value;
        const container = document.getElementById("results-container");

        try {
          const res = await fetch(
            `${API_URL}/diagnosticos?busca=${encodeURIComponent(termo)}`,
          );
          const data = await res.json();

          container.innerHTML = data.length
            ? data
                .map(
                  (item) => `
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div class="flex justify-between items-start mb-2">
              <span class="font-bold text-sky-400">${item.id_linha || "Geral"} - ${item.id_equipamento || "Equipamento"}</span>
              <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">${item.codigo_falha || "S/N"}</span>
            </div>
            <p class="text-sm text-slate-300 mb-2">${item.descricao_solucao}</p>
            <div class="flex justify-between items-center text-xs text-slate-500">
              <span>Técnico: ${item.id_tecnico || "Desconhecido"}</span>
              <span>${item.data ? new Date(item.data).toLocaleString("pt-BR") : ""}</span>
            </div>
          </div>
        `,
                )
                .join("")
            : '<p class="text-center text-slate-500 py-4">Nenhum registro encontrado.</p>';
        } catch (err) {
          console.error("Erro ao buscar ocorrências:", err);
        }
      }

      async function salvarOcorrencia(e) {
        e.preventDefault();
        const btn = document.getElementById("btn-salvar-ocorrencia");
        btn.disabled = true;
        btn.innerText = "Salvando...";

        const payload = {
          id_linha: document.getElementById("select-linha").value,
          id_equipamento: document.getElementById("select-equipamento").value,
          id_tecnico: usuarioLogado.usuario,
          codigo_falha: document.getElementById("cad-falha").value,
          descricao_solucao: document.getElementById("cad-solucao").value,
          data: new Date().toISOString(),
        };

        try {
          const res = await fetch(`${API_URL}/diagnosticos`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!res.ok) throw new Error("Erro ao salvar no servidor");

          alert("Ocorrência registrada com sucesso!");
          document.getElementById("cad-falha").value = "";
          document.getElementById("cad-solucao").value = "";
          switchTab("consultar");
          buscarOcorrencias();
        } catch (err) {
          alert("Falha ao salvar ocorrência: " + err.message);
        } finally {
          btn.disabled = false;
          btn.innerText = "Registrar Ocorrência";
        }
      }

      function gerarSenhaRandomica() {
        const chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";
        let pass = "";
        for (let i = 0; i < 10; i++)
          pass += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById("admin-user-pass").value = pass;
      }

      async function carregarUsuarios() {
        try {
          const res = await fetch(`${API_URL}/usuarios`);
          const users = await res.json();
          const container = document.getElementById("users-list-container");

          container.innerHTML = users
            .map((u) => {
              const nome = u.usuario || u.id;
              const role = u.role || "tecnico";
              return `
            <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg text-xs border border-slate-800">
              <div>
                <span class="font-bold text-sky-400">${nome}</span> 
                <span class="text-slate-400">(${role})</span>
              </div>
              <div class="flex gap-2">
                <button onclick="editarUsuario('${nome}', '${role}')" class="bg-amber-600/20 text-amber-400 hover:bg-amber-600/40 px-2.5 py-1 rounded transition">Editar</button>
                ${
                  nome !== "admin"
                    ? `
                  <button onclick="excluirUsuario('${nome}')" class="bg-red-600/20 text-red-400 hover:bg-red-600/40 px-2.5 py-1 rounded transition">Excluir</button>
                `
                    : '<span class="text-slate-600 px-2 py-1">Fixo</span>'
                }
              </div>
            </div>
          `;
            })
            .join("");
        } catch (err) {
          console.error("Erro ao carregar usuários:", err);
        }
      }

      function editarUsuario(nome, role) {
        document.getElementById("admin-user-name").value = nome;
        document.getElementById("admin-user-pass").value = "";
        document.getElementById("admin-user-role").value = role;
        document.getElementById("admin-user-pass").placeholder =
          "Deixe em branco para manter a mesma";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function excluirUsuario(usuario) {
        if (!confirm(`Confirma a exclusão do usuário "${usuario}"?`)) return;

        try {
          const res = await fetch(
            `${API_URL}/usuarios?usuario=${encodeURIComponent(usuario)}`,
            {
              method: "DELETE",
            },
          );

          if (!res.ok) throw new Error("Falha ao excluir usuário");

          alert("Usuário excluído com sucesso!");
          carregarUsuarios();
        } catch (err) {
          alert(err.message);
        }
      }

      async function salvarUsuario(e) {
        e.preventDefault();
        const payload = {
          usuario: document.getElementById("admin-user-name").value,
          senha: document.getElementById("admin-user-pass").value,
          role: document.getElementById("admin-user-role").value,
        };

        try {
          const res = await fetch(`${API_URL}/usuarios`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!res.ok) throw new Error("Erro ao salvar usuário");

          alert("Usuário atualizado no DynamoDB!");
          document.getElementById("admin-user-name").value = "";
          document.getElementById("admin-user-pass").value = "";
          document.getElementById("admin-user-pass").placeholder = "Senha";
          carregarUsuarios();
        } catch (err) {
          alert(err.message);
        }
      }
    </script>
  </body>
</html>
